services:
  supplier-postgres:
    image: postgres:16-alpine
    container_name: supplier-postgres
    hostname: supplier-postgres
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d supplier_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-postgres:
    image: postgres:16-alpine
    container_name: customer-postgres
    hostname: customer-postgres
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - customer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-broker:
    image: apache/kafka:4.2.0
    container_name: kafka-broker
    hostname: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_started

  supplier-service:
    build:
      context: ./supplier-service
    container_name: supplier-service
    hostname: supplier-service
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_SUPPLIER_TOPIC: supplier-events
      KAFKA_PRODUCT_TOPIC: product-events
      KAFKA_PRODUCT_STOCK_TOPIC: product-stock-events
      KAFKA_ORDER_TOPIC: order-events
      KAFKA_ORDER_GROUP_ID: supplier-order-events-consumer-group
    ports:
      - "8000:8000"
    depends_on:
      supplier-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    hostname: customer-service
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@customer-postgres:5432/customer_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_PRODUCT_TOPIC: product-events
      KAFKA_ORDER_TOPIC: order-events
      KAFKA_PRODUCT_STOCK_TOPIC: product-stock-events
      KAFKA_PRODUCTS_GROUP_ID: customer-product-events-consumer-group
      SUPPLIER_PRODUCTS_URL: http://supplier-service:8000/products
    ports:
      - "8001:8001"
    depends_on:
      customer-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      supplier-service:
        condition: service_started

  audit-consumer:
    build:
      context: ./audit-consumer
    container_name: audit-consumer
    hostname: audit-consumer
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_SUPPLIER_TOPIC: supplier-events
      KAFKA_GROUP_ID: audit-supplier-events-consumer-group
    depends_on:
      supplier-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started

volumes:
  postgres_data:
  customer_postgres_data:
