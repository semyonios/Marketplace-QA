services:
  supplier-postgres:
    image: postgres:16-alpine
    container_name: supplier-postgres
    hostname: supplier-postgres
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d supplier_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-postgres:
    image: postgres:16-alpine
    container_name: customer-postgres
    hostname: customer-postgres
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - customer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    hostname: order-postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
      POSTGRES_USER: ${ORDER_DB_USER:-order_app}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_app}
    ports:
      - "${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-broker:
    image: apache/kafka:4.2.0
    container_name: kafka-broker
    hostname: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_started

  supplier-service:
    build:
      context: ./supplier-service
    container_name: supplier-service
    hostname: supplier-service
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_SUPPLIER_TOPIC: supplier-events
      KAFKA_PRODUCT_TOPIC: product-events
      KAFKA_PRODUCT_STOCK_TOPIC: product-stock-events
      SERVICE_NAME: supplier-service
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      ALEMBIC_CONFIG: /app/alembic.ini
      READINESS_TIMEOUT_SECONDS: 2
      RESERVATION_CONSUMER_ENABLED: "true"
      SUPPLIER_OUTBOX_PUBLISHER_ENABLED: "true"
      KAFKA_STOCK_COMMANDS_TOPIC: marketplace.stock.commands.v1
      KAFKA_STOCK_EVENTS_TOPIC: marketplace.stock.events.v1
      KAFKA_DLQ_TOPIC: marketplace.order.dlq.v1
    ports:
      - "8000:8000"
    depends_on:
      supplier-postgres:
        condition: service_healthy
      supplier-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  supplier-migrations:
    build:
      context: ./supplier-service
    container_name: supplier-migrations
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      ALEMBIC_CONFIG: /app/alembic.ini
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      supplier-postgres:
        condition: service_healthy
    restart: "no"

  supplier-reservation-consumer:
    build:
      context: ./supplier-service
    container_name: supplier-reservation-consumer
    hostname: supplier-reservation-consumer
    command: ["python", "-m", "app.stock_consumer"]
    environment:
      SERVICE_NAME: supplier-service
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      ALEMBIC_CONFIG: /app/alembic.ini
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      RESERVATION_CONSUMER_ENABLED: "true"
      RESERVATION_CONSUMER_GROUP_ID: supplier-service-stock-commands-v1
      RESERVATION_CONSUMER_NAME: supplier-service-stock-commands-v1
      CONSUMER_MAX_ATTEMPTS: 3
      CONSUMER_POLL_SECONDS: 1
      KAFKA_DELIVERY_TIMEOUT_SECONDS: 10
      KAFKA_STOCK_COMMANDS_TOPIC: marketplace.stock.commands.v1
      KAFKA_STOCK_EVENTS_TOPIC: marketplace.stock.events.v1
      KAFKA_DLQ_TOPIC: marketplace.order.dlq.v1
    depends_on:
      supplier-postgres:
        condition: service_healthy
      supplier-migrations:
        condition: service_completed_successfully
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  supplier-outbox-publisher:
    build:
      context: ./supplier-service
    container_name: supplier-outbox-publisher
    hostname: supplier-outbox-publisher
    command: ["python", "-m", "app.outbox_publisher"]
    environment:
      SERVICE_NAME: supplier-service
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      ALEMBIC_CONFIG: /app/alembic.ini
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      SUPPLIER_OUTBOX_PUBLISHER_ENABLED: "true"
      SUPPLIER_OUTBOX_POLL_INTERVAL_SECONDS: 1
      SUPPLIER_OUTBOX_BATCH_SIZE: 100
      SUPPLIER_OUTBOX_CLAIM_LEASE_SECONDS: 30
      SUPPLIER_OUTBOX_BASE_RETRY_DELAY_SECONDS: 1
      SUPPLIER_OUTBOX_MAX_RETRY_DELAY_SECONDS: 30
      SUPPLIER_OUTBOX_MAX_ATTEMPTS: 10
      KAFKA_DELIVERY_TIMEOUT_SECONDS: 10
      KAFKA_STOCK_EVENTS_TOPIC: marketplace.stock.events.v1
    depends_on:
      supplier-postgres:
        condition: service_healthy
      supplier-migrations:
        condition: service_completed_successfully
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    hostname: customer-service
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@customer-postgres:5432/customer_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_PRODUCT_TOPIC: product-events
      KAFKA_ORDER_TOPIC: order-events
      KAFKA_PRODUCT_STOCK_TOPIC: product-stock-events
      KAFKA_PRODUCTS_GROUP_ID: customer-product-events-consumer-group
      SUPPLIER_PRODUCTS_URL: http://supplier-service:8000/products
    ports:
      - "8001:8001"
    depends_on:
      customer-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      supplier-service:
        condition: service_started

  order-migrations:
    build:
      context: ./order-service
    container_name: order-migrations
    environment:
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:-order_app}:${ORDER_DB_PASSWORD:-order_app}@order-postgres:5432/${ORDER_DB_NAME:-order_db}
      ALEMBIC_CONFIG: /app/alembic.ini
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      order-postgres:
        condition: service_healthy
    restart: "no"

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    hostname: order-service
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:-order_app}:${ORDER_DB_PASSWORD:-order_app}@order-postgres:5432/${ORDER_DB_NAME:-order_db}
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      CUSTOMER_SERVICE_URL: http://customer-service:8001
      CUSTOMER_SERVICE_TIMEOUT_SECONDS: 1
      READINESS_TIMEOUT_SECONDS: 2
      ALEMBIC_CONFIG: /app/alembic.ini
      OUTBOX_PUBLISHER_ENABLED: "true"
      STOCK_EVENTS_CONSUMER_ENABLED: "true"
      KAFKA_ORDER_EVENTS_TOPIC: marketplace.order.events.v1
      KAFKA_STOCK_COMMANDS_TOPIC: marketplace.stock.commands.v1
      KAFKA_STOCK_EVENTS_TOPIC: marketplace.stock.events.v1
      KAFKA_DLQ_TOPIC: marketplace.order.dlq.v1
    ports:
      - "${ORDER_SERVICE_PORT:-8002}:8000"
    depends_on:
      order-postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  order-outbox-publisher:
    build:
      context: ./order-service
    container_name: order-outbox-publisher
    hostname: order-outbox-publisher
    command: ["python", "-m", "app.outbox_publisher"]
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:-order_app}:${ORDER_DB_PASSWORD:-order_app}@order-postgres:5432/${ORDER_DB_NAME:-order_db}
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_POLL_INTERVAL_SECONDS: 1
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_CLAIM_LEASE_SECONDS: 30
      OUTBOX_BASE_RETRY_DELAY_SECONDS: 1
      OUTBOX_MAX_RETRY_DELAY_SECONDS: 30
      OUTBOX_MAX_ATTEMPTS: 10
      KAFKA_DELIVERY_TIMEOUT_SECONDS: 10
      KAFKA_ORDER_EVENTS_TOPIC: marketplace.order.events.v1
      KAFKA_STOCK_COMMANDS_TOPIC: marketplace.stock.commands.v1
    depends_on:
      order-postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  order-stock-events-consumer:
    build:
      context: ./order-service
    container_name: order-stock-events-consumer
    hostname: order-stock-events-consumer
    command: ["python", "-m", "app.stock_events_consumer"]
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${ORDER_DB_USER:-order_app}:${ORDER_DB_PASSWORD:-order_app}@order-postgres:5432/${ORDER_DB_NAME:-order_db}
      LOG_LEVEL: INFO
      ALEMBIC_CONFIG: /app/alembic.ini
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      STOCK_EVENTS_CONSUMER_ENABLED: "true"
      STOCK_EVENTS_CONSUMER_GROUP_ID: order-service-stock-events-v1
      STOCK_EVENTS_CONSUMER_NAME: order-service-stock-events-v1
      STOCK_EVENTS_CONSUMER_MAX_ATTEMPTS: 3
      STOCK_EVENTS_CONSUMER_POLL_SECONDS: 1
      KAFKA_DELIVERY_TIMEOUT_SECONDS: 10
      KAFKA_STOCK_EVENTS_TOPIC: marketplace.stock.events.v1
      KAFKA_DLQ_TOPIC: marketplace.order.dlq.v1
    depends_on:
      order-postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  audit-consumer:
    build:
      context: ./audit-consumer
    container_name: audit-consumer
    hostname: audit-consumer
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@supplier-postgres:5432/supplier_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_SUPPLIER_TOPIC: supplier-events
      KAFKA_GROUP_ID: audit-supplier-events-consumer-group
    depends_on:
      supplier-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started

volumes:
  postgres_data:
  customer_postgres_data:
  order_postgres_data:
