$kind: http-request
url: "{{base_url}}/posts"
method: GET
headers:
  Authorization: Bearer {{access_token}}
auth:
  type: apikey
  credentials:
    key: app-id
    value: 0JyYiOQXQQr5H9OEn21312
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json(1);

      // берём id первого поста
      pm.environment.set("post_id", response[1].id)
    language: text/javascript
order: 2000
